<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羅技 G 官方旗艦商城 - 職業電競裝備</title>
  <style>
    :root {
      --bg-midnight: #05070e;
      --card-bg: #0c101a;
      --card-hover: #131927;
      --border-steel: #1e293b;
      --g-cyan: #00b8fc;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --font-mono: "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-midnight);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 120px;
      overflow-x: hidden;
    }

    /* 頂部導覽列 */
    nav {
      height: 64px;
      border-bottom: 1px solid var(--border-steel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(5, 7, 14, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left { display: flex; align-items: center; gap: 24px; }
    .nav-logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-logo span {
      background: var(--g-cyan);
      color: #000;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .nav-right { display: flex; align-items: center; gap: 16px; }
    .cart-trigger {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .cart-trigger:hover { border-color: var(--g-cyan); }
    .cart-badge {
      background: var(--g-cyan);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 6px;
    }

    /* G HUB Hero 看板 */
    .hub-hero {
      position: relative;
      min-height: 480px;
      background: radial-gradient(circle at 75% 50%, #0c2044 0%, #05070e 70%);
      border-bottom: 1px solid var(--border-steel);
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .hub-grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 184, 252, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 184, 252, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .hub-container {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .hub-title { font-size: 48px; font-weight: 900; margin-bottom: 16px; }
    .hub-sub { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
    .hub-sub span { color: var(--g-cyan); }

    /* 色環動效模組 */
    .rgb-wheel-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rgb-wheel-track {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(#ff0055, #ff9900, #ffee00, #00ff66, #00b8fc, #6600ff, #ff0055);
      -webkit-mask: radial-gradient(transparent 110px, #000 111px);
      mask: radial-gradient(transparent 110px, #000 111px);
    }
    .orbit-cursor-container {
      position: absolute;
      inset: 0;
      animation: wheelSpin 6s linear infinite;
    }
    .orbit-dot {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 16px var(--g-cyan);
    }
    @keyframes wheelSpin { to { transform: rotate(360deg); } }

    /* 商城控制列（分類與搜尋） */
    .store-control {
      max-width: 1320px;
      margin: 40px auto 20px;
      padding: 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .filter-pills { display: flex; gap: 10px; }
    .filter-pill {
      padding: 8px 20px;
      border-radius: 20px;
      background: #111827;
      border: 1px solid #1e293b;
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .filter-pill.active, .filter-pill:hover {
      background: var(--g-cyan);
      color: #000;
      border-color: var(--g-cyan);
    }

    .search-box input {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      width: 220px;
      transition: width 0.2s, border-color 0.2s;
    }
    .search-box input:focus {
      width: 280px;
      border-color: var(--g-cyan);
    }

    /* 產品卡片 */
    .container { max-width: 1320px; margin: 0 auto; padding: 0 40px; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 30px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-steel);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--g-cyan);
    }
    .card-img-container {
      width: 100%;
      height: 260px;
      background: #080c14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .card-img-container img { transform: scale(1.04); }

    .card-content {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-cat {
      font-size: 11px;
      color: var(--g-cyan);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .card-content h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .card-content p { color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
    
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #1a2234;
      padding-top: 16px;
    }
    .price { font-size: 18px; font-weight: 800; color: #fff; }
    .actions { display: flex; gap: 8px; }
    .btn-cart {
      background: var(--g-cyan);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-cart:hover { opacity: 0.9; }
    .btn-link {
      color: var(--text-muted);
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
    }

    /* 抽屜式購物車 */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: #0b0f19;
      border-left: 1px solid var(--border-steel);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      z-index: 1000;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .cart-drawer.open { right: 0; }
    .cart-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-steel);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #192233;
    }
    .cart-footer {
      padding: 20px;
      border-top: 1px solid var(--border-steel);
      background: #080c14;
    }
    .cart-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin-bottom: 16px; }
    .btn-checkout {
      width: 100%;
      padding: 12px;
      background: var(--g-cyan);
      color: #000;
      border: none;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <nav>
    <div class="nav-left">
      <a href="/" class="nav-logo">LOGITECH <span>PRO</span></a>
    </div>
    <div class="nav-right">
      <button class="cart-trigger" onclick="toggleCart()">
        🛒 購物車 <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </nav>

  <!-- G HUB 官方 Hero 看板 -->
  <section class="hub-hero">
    <div class="hub-grid-bg"></div>
    <div class="hub-container">
      <div>
        <h1 class="hub-title">指派。調校。沉浸。暢玩。</h1>
        <p class="hub-sub">社群在此連結，創造無限可能 <span>+</span></p>
      </div>
      <div class="rgb-wheel-wrapper">
        <div class="rgb-wheel-track"></div>
        <div class="orbit-cursor-container"><div class="orbit-dot"></div></div>
      </div>
    </div>
  </section>

  <!-- 控制列：分類與搜尋 -->
  <div class="store-control">
    <div class="filter-pills">
      <a href="/?category=all" class="filter-pill {{ 'active' if current_cat == 'all' }}">全部系列</a>
      <a href="/?category=mouse" class="filter-pill {{ 'active' if current_cat == 'mouse' }}">電競滑鼠</a>
      <a href="/?category=keyboard" class="filter-pill {{ 'active' if current_cat == 'keyboard' }}">機械鍵盤</a>
      <a href="/?category=headset" class="filter-pill {{ 'active' if current_cat == 'headset' }}">耳機麥克風</a>
    </div>
    <form class="search-box" action="/" method="GET">
      <input type="text" name="search" placeholder="搜尋 PRO 系列產品..." value="{{ request.args.get('search', '') }}">
    </form>
  </div>

  <!-- 產品展示清單 -->
  <div class="container">
    <div class="products-grid">
      {% for item in products %}
      <div class="card">
        <div class="card-img-container">
          <img src="{{ item.image_url }}" alt="{{ item.name }}">
        </div>
        <div class="card-content">
          <div>
            <div class="product-cat">PRO SERIES // {{ item.category }}</div>
            <h2>{{ item.name }}</h2>
            <p>{{ item.tagline }}</p>
          </div>
          <div class="card-footer">
            <div class="price">NT$ {{ "{:,}".format(item.price or 4990) }}</div>
            <div class="actions">
              <a href="/product/{{ item.id }}" class="btn-link">規格</a>
              <button class="btn-cart" onclick="addToCart('{{ item.id }}', '{{ item.name }}', {{ item.price or 4990 }})">加入購物車</button>
            </div>
          </div>
        </div>
      </div>
      {% else %}
      <p style="text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 60px;">
        未找到相符的裝備，請嘗試不同關鍵字。
      </p>
      {% endfor %}
    </div>
  </div>

  <!-- 側邊抽屜式購物車 -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>您的裝備清單</h3>
      <button class="cart-close" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItemsContainer"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>總結金額</span>
        <span id="cartTotalSum">NT$ 0</span>
      </div>
      <button class="btn-checkout" onclick="alert('訂單建立成功！感謝購買羅技 G PRO 裝備。')">立即結帳</button>
    </div>
  </div>

  <!-- 購物車本機處理邏輯 -->
  <script>
    let cart = JSON.parse(localStorage.getItem('gpro_cart') || '[]');

    function saveAndRender() {
      localStorage.setItem('gpro_cart', JSON.stringify(cart));
      renderCart();
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    function addToCart(id, name, price) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      saveAndRender();
      document.getElementById('cartDrawer').classList.add('open');
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      }
      saveAndRender();
    }

    function renderCart() {
      const container = document.getElementById('cartItemsContainer');
      const countBadge = document.getElementById('cartCount');
      const totalSum = document.getElementById('cartTotalSum');
      
      container.innerHTML = '';
      let total = 0;
      let count = 0;

      cart.forEach(item => {
        total += item.price * item.qty;
        count += item.qty;
        container.innerHTML += `
          <div class="cart-item">
            <div>
              <div style="font-weight: 700; font-size: 14px;">${item.name}</div>
              <div style="color: var(--g-cyan); font-size: 13px; margin-top: 4px;">NT$ ${item.price.toLocaleString()}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <button onclick="updateQty('${item.id}', -1)" style="padding: 2px 8px; background: #1e293b; color: #fff; border: none; cursor: pointer;">-</button>
              <span>${item.qty}</span>
              <button onclick="updateQty('${item.id}', 1)" style="padding: 2px 8px; background: #1e293b; color: #fff; border: none; cursor: pointer;">+</button>
            </div>
          </div>
        `;
      });

      countBadge.innerText = count;
      totalSum.innerText = 'NT$ ' + total.toLocaleString();
    }

    renderCart();
  </script>
</body>
</html>
